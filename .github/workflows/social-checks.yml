name: Accounts en groepsbeveiliging testen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'shared/**', 'firebase/**', 'firebase.json', 'tests/social*', 'tools/build-social.mjs', 'package*.json', '.github/workflows/social-checks.yml']
  pull_request:
    paths: ['android/**', 'shared/**', 'firebase/**', 'firebase.json', 'tests/social*', 'tools/build-social.mjs', 'package*.json']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node --test
      - run: node tools/build-social.mjs
      - name: Auth en Firestore testen zonder echte cloudkosten
        run: npx firebase emulators:exec --project demo-fieldday --only auth,firestore 'node --test tests/social-emulator.test.mjs'
